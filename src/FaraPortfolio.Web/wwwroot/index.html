<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120a22" />
    <!-- Google AdSense のサイト所有権の確認（広告のスクリプトはまだ読み込まない） -->
    <meta name="google-adsense-account" content="ca-pub-1153198089337531" />
    <!-- SEO-HEAD:START -->
    <title>Fara Portfolio</title>
    <!-- SEO-HEAD:END -->
    <base href="/" />
    <!-- ファビコン（分子モデル。背景なし・白い縁取り）。4 サイト共通のルート直下の固定名。版は ?v=N で管理（絵を変えたら N を上げる）。
         favicon.ico は同名のまま中身を差し替えたので、古いキャッシュを避けるため ?v=2 にしてある（他は新しい URL なので ?v=1）。
         ブラウザは /favicon.ico を直接取りに来るのでルートに置く（無いと 404 ページの HTML が返る）。48px の PNG は ico に含まれる -->
    <link rel="icon" href="favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1" />
    <!-- 起動までの読み込み表示（画面全体を覆う不透明なオーバーレイ）。最初に当てる（CSS の読み込み前にも本文が見えないように、インラインで書く）。
         サイトはダーク配色だけ（html の data-bs-theme="dark" で固定） -->
    <style>
        html { background: #0c0616; }
        /* 保険: JS が動かない（読めない・失敗した）ときも、60 秒たったら隠れて本文を読めるようにする（kit の boot-indicator.js の RELEASE_MS と同じ秒数） */
        #boot-indicator {
            position: fixed; inset: 0; z-index: 2147483000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
            box-sizing: border-box; padding: 1.5rem;
            background: #0c0616; color: #e9e3f5;
            font-family: "Zen Kaku Gothic New", "Yu Gothic", system-ui, sans-serif;
            animation: boot-indicator-release 0s linear 60s forwards;
        }
        @keyframes boot-indicator-release { to { visibility: hidden; } }
        .boot-indicator-spinner {
            width: 3rem; height: 3rem; box-sizing: border-box;
            border: 0.3rem solid #a855f7; border-right-color: transparent; border-radius: 50%;
            animation: boot-indicator-spin 0.75s linear infinite;
        }
        .boot-indicator-label { font-size: 0.95rem; font-weight: 700; line-height: 1.6; text-align: center; max-width: 24rem; }
        .boot-indicator-label:empty::before { content: "読み込み中…"; }
        .boot-indicator-label a { color: #a855f7; font-weight: 700; text-decoration: underline; pointer-events: auto; }
        #boot-indicator[data-state="slow"] .boot-indicator-spinner { animation: none; }
        @keyframes boot-indicator-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .boot-indicator-spinner { animation: none; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=block: フォントが届くまで文字を出さない。swap だと、フォールバックの字で描いてから Zen Kaku に差し替わり、折り返しが変わって本文が動く（/privacy 768 の CLS 0.54）。block にすると、ずれが小さくなる（0.08）。残りは、フォールバックとフォントの折り返しの差。0 にするには optional が要るが、初回の訪問で Zen Kaku が出なくなるので採用していない -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=block" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- 共通部品（fara-blazor-component）の CSS。サイトの app.css より前に読む（同じ強さの規則は app.css が勝つ） -->
    <link href="_content/FaraBlazorComponent.Razor/css/fara-blazor-component.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <!-- JavaScript が無いときは読み込み表示を出さない（静的な本文をそのまま読める）。インラインの script は CSP で使えないので style で隠す -->
    <noscript><style>#boot-indicator { display: none; }</style></noscript>
</head>
<body>
    <!-- 起動までの読み込み表示。#app の外に置く（Blazor が #app の中身を置き換えても残るので、boot-indicator.js（kit）が起動後に外す）。
         静的な本文（class="entry-static"）は、このオーバーレイの下に DOM として残す（検索エンジン・JavaScript が無い環境のため） -->
    <div id="boot-indicator" class="boot-indicator">
        <div class="boot-indicator-spinner" aria-hidden="true"></div>
        <span class="boot-indicator-label" role="status" aria-live="polite" aria-label="読み込み中"></span>
    </div>
    <div id="app">
        <!-- SEO-BODY:START -->
        <!-- SEO-BODY:END -->
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。ページを再読み込みしてください。
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/FaraBlazorComponent.Razor/js/boot-indicator.js"></script>
    <script src="_content/FaraBlazorComponent.Razor/js/fara-blazor-component.js"></script>
    <script src="_content/FaraBlazorComponent.Razor/js/report.js"></script>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
