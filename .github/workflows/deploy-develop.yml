name: Deploy (develop)

# 確認用（https://dev.fara-labs.com/）への公開。develop に push（PR のマージ含む）されるたびに実行。
# 本番には影響しない。手動で再実行したいときは Actions タブから develop を選んで Run workflow。
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    # Settings → Environments の develop（develop からのみ実行可にしておく）
    environment:
      name: develop
      url: https://dev.fara-labs.com/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test (data files)
        run: dotnet test --configuration Release

      # 確認用（dev.fara-labs.com）の公開用サイトの作成。fara-labs.com 配下のリンクは確認用の URL にし、検索結果に載らない（noindex）_headers を付ける
      - name: Publish static site (develop)
        run: npm run publish:site:develop

      - name: Deploy to Cloudflare Workers (develop)
        run: npx wrangler deploy --env develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
