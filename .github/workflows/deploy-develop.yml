name: Deploy (develop)

# 確認用（https://dev.fara-labs.com/）への公開。develop に push（PR のマージ含む）されるたびに実行。
# 本番には影響しない。手動で再実行したいときは Actions タブから develop を選んで Run workflow。
# メンテナンス表示を切り替えたいときも同じ画面で、maintenance_mode / maintenance_message を入れて実行する（空なら現在の値のまま）。
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-develop
  # 途中で取り消さない（取り消すと、確認用の公開が中途半端なまま残るおそれがあるため。本番と同じ。待っている分は、新しいものに置き換わる）
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    # Settings → Environments の develop（develop からのみ実行可にしておく）
    environment:
      name: develop
      url: https://dev.fara-labs.com/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test (data files)
        run: dotnet test --configuration Release

      # 確認用（dev.fara-labs.com）の公開用サイトの作成。fara-labs.com 配下のリンクは確認用の URL にし、検索結果に載らない（noindex）_headers を付ける
      - name: Publish static site (develop)
        run: npm run publish:site:develop

      # メンテナンス表示の文は、--var に渡す前に確かめる（200 文字まで・改行なし。scripts/maintenance-message.mjs）
      - name: Check maintenance message
        id: message
        run: node .github/scripts/maintenance-message.mjs
        env:
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}

      # メンテナンス表示（Worker の変数）は、手動実行の入力があるときだけ --var で渡す。空なら付けない（keep_vars で現在の値が残る）
      - name: Deploy to Cloudflare Workers (develop)
        shell: bash
        run: |
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT"); fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx wrangler deploy --env develop "${vars[@]}"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 文の検査が失敗したら（未検査の文を書かないよう）概要は書かない。公開が失敗しただけなら書く
      - name: Summary (maintenance)
        if: ${{ always() && steps.message.outcome == 'success' }}
        shell: bash
        run: |
          # Markdown の特殊文字を落とす（改行・< >・バッククォートは、コードの囲みを壊すので外す）
          msg="$(printf '%s' "$MAINTENANCE_MESSAGE_INPUT" | tr -d '\r\n<>' | tr '`' '"')"
          {
            echo "### メンテナンス表示 (${WORKER_NAME})"
            echo "- 設定した値: MAINTENANCE_MODE=\`${MAINTENANCE_MODE_INPUT:-(変更なし)}\` / MAINTENANCE_MESSAGE=\`${msg:-(変更なし)}\`"
            node .github/scripts/maintenance-summary.mjs
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: fara-portfolio-dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
