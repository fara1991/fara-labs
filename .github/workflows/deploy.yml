name: Deploy

# 手動実行のみ（Actions タブ →「Deploy」→「Run workflow」）。
# PR のマージや push では公開されない。常に master ブランチの内容を公開する。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test (data files)
        run: dotnet test --configuration Release

      # SourceRevisionId: フッターの build 表示と、data/*.json のキャッシュ回避に使う
      - name: Publish Blazor WebAssembly
        run: >
          dotnet publish src/FaraPortfolio.Web
          --configuration Release
          --output publish
          -p:SourceRevisionId=$(git rev-parse HEAD)

      # ルート（https://app-fara.com/）で公開するので <base href="/" /> はそのまま。
      # /works などを直接開いたときも Blazor が表示されるよう 404.html に index.html を複製する。
      - name: Prepare SPA fallback
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
