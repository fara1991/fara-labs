name: Deploy (production)

# 本番（https://fara-labs.com/）への公開。master に push（develop → master の PR のマージ含む）されるたびに実行。
# 手動で公開し直したいときは Actions タブ →「Deploy (production)」→「Run workflow」（master を選ぶ）。常に master の内容を公開する。
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE_MODE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開され、メンテナンス画面にもならない）"
        type: boolean
        default: false
      first_publish:
        description: "Worker がまだ無いとき（初回の公開）だけ入れる。入れないと、Worker が見つからない（404）場合は公開を止める"
        type: boolean
        default: false
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Settings → Environments の production（master からのみ実行可にしておく）
    environment:
      name: production
      url: https://fara-labs.com/
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::本番の公開は master から実行してください（Use workflow from: master）"
          exit 1

      # 実行のきっかけになったコミット（github.sha）を公開する。master のみなのは上の Require master で保証
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test (data files)
        run: dotnet test --configuration Release

      # 公開する静的サイトの作成（dotnet publish → 本文入りの入口ページ → _headers・robots・sitemap）
      - name: Publish static site
        run: npm run publish:site

      # push（master）と、値を指定しない手動実行は、公開の前に Cloudflare の Worker の変数 MAINTENANCE_MODE が notice（更新予定のお知らせを出している）かを確かめる。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）。
      # maintenance_mode に true / notice / false を指定した手動実行（maintenance-cli の set）は、操作した人の意思なので、確認を飛ばす
      - name: Require MAINTENANCE_MODE=notice
        if: ${{ !contains(fromJSON('["true","notice","false"]'), inputs.maintenance_mode) }}
        run: node .github/scripts/require-maintenance.mjs fara-portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          # 初回の公開（Worker がまだ無い）だけ 1。それ以外は、Worker が見つからない（404）と止める
          ALLOW_MISSING_WORKER: ${{ inputs.first_publish && '1' || '0' }}

      # メンテナンス表示の文は、--var に渡す前に確かめる（200 文字まで・改行なし。scripts/maintenance-message.mjs）
      - name: Check maintenance message
        run: node .github/scripts/maintenance-message.mjs
        env:
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}

      # push と、何も指定しない手動実行だけ、公開と同時に MAINTENANCE_MODE=true（メンテナンス画面）にする。作業が終わったら、Run workflow（maintenance_mode=false）か Cloudflare で戻す（お知らせも一緒に消える）。
      # skip_maintenance_check のとき（緊急の修正）と、maintenance_message だけの手動実行は、MAINTENANCE_MODE を渡さない（現在の値を保持）
      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then
            vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT")
          elif [ -z "$MAINTENANCE_MESSAGE_INPUT" ] && [ "$SKIP_MAINTENANCE_CHECK" != "true" ]; then
            vars+=(--var "MAINTENANCE_MODE:true")
          fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx wrangler deploy --env="" "${vars[@]}"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary (maintenance)
        if: ${{ always() }}
        shell: bash
        run: |
          msg="$(printf '%s' "$MAINTENANCE_MESSAGE_INPUT" | tr '`' '"')"
          {
            echo "### メンテナンス表示 (${WORKER_NAME})"
            echo "- 設定した値: MAINTENANCE_MODE=\`${MAINTENANCE_MODE_INPUT:-(変更なし)}\` / MAINTENANCE_MESSAGE=\`${msg:-(変更なし)}\`"
            node .github/scripts/maintenance-summary.mjs
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: fara-portfolio
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
