name: Deploy

# 本番（https://fara-labs.com/）への公開。master に push（develop → master の PR のマージ含む）されるたびに実行。
# 手動で公開し直したいときは Actions タブ →「Deploy」→「Run workflow」（master を選ぶ）。常に master の内容を公開する。
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開され、メンテナンス画面にもならない）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Settings → Environments の production（master からのみ実行可にしておく）
    environment:
      name: production
      url: https://fara-labs.com/
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::本番の公開は master から実行してください（Use workflow from: master）"
          exit 1

      # 実行のきっかけになったコミット（github.sha）を公開する。master のみなのは上の Require master で保証
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test (data files)
        run: dotnet test --configuration Release

      - name: Report form script test
        run: npm run test:js

      # 静的 SSR の書き出し（dist/。ページごとの HTML）
      - name: Export static site
        run: >
          dotnet run --project src/FaraPortfolio.Web
          --configuration Release
          --no-launch-profile
          -- --export dist

      # 本番の公開は、Cloudflare の Worker の変数 MAINTENANCE が notice（更新予定のお知らせを出している）のときだけ行う。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）
      - name: Require MAINTENANCE=notice
        run: node .github/scripts/require-maintenance.mjs fara-portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}

      # 公開と同時に MAINTENANCE=true（メンテナンス画面）にする。作業が終わったら、Cloudflare で false に戻す（お知らせも一緒に消える）。
      # 確認を飛ばしたとき（緊急の修正）は、メンテナンス画面にしない
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env="" ${{ inputs.skip_maintenance_check && ' ' || '--var MAINTENANCE:true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
